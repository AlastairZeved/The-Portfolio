:root {
  /* B48 — the idea-board token block from TheBoards styles.css
     `#board[data-cat="idea"]`, transcribed byte-exact (issue #134 §4). NOT a
     re-hue. Ink and tokens the green block does not redefine come from
     TheBoards' :root verbatim. The selected-card glow token is --frame itself
     (agent-derived, per the UIUX repo law: inventing a "one rung down" hex
     would be a design-value invention; --frame is an existing shipped
     value). --ink-dim is career.html's shipped dim value, reused. */
  --deep:      #000a06;            /* idea --deep (TheBoards, verbatim) */
  --card:      #001a0e;            /* idea --card */
  --water-top: #486b49;            /* idea --water-top */
  --water-mid: #345439;            /* idea --water-mid */
  --water-bot: #1f3825;            /* idea --water-bot */
  --water-bot-a: 31 56 37;         /* idea --water-bot-a (rgb channels) */
  --frame:     #52997f;            /* idea --frame — borders, rules, AND the selected-card glow token */
  --note:      #b9d2b2;            /* idea --note */
  --ink-light: #f4f5f1;            /* TheBoards :root, verbatim */
  --ink-dark:  #031019;            /* TheBoards :root, verbatim */
  --ink:       var(--ink-light);   /* TheBoards :root, verbatim */
  --ink-dim:   rgb(244 245 241 / 0.55);   /* career.html's shipped dim value */
  --elevation: 0 2px 8px rgb(0 0 0 / 0.45);  /* career.html's value, verbatim */
  --ease:      cubic-bezier(0.22, 0.61, 0.36, 1);  /* career.html's value, verbatim */
}

html, body { min-height: 100dvh; }

/* The page's one h1, off-canvas: the visible headings are the two selector
   wordmarks, all the same level, none of them encoding selection state. */
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--deep);
  color: var(--ink-light);
  font: 400 1rem/1.6 "Montserrat Alternates", system-ui, sans-serif;
}

:is(a, button, label:has(input:focus-visible)):focus-visible {
  outline: 2px solid var(--ink-light);
  outline-offset: 2px;
}

/* ---- Header — the two-page selector (issue #134 §1). career.html's
   .topband grammar: water-gradient-over-card band closed by a 1px --frame
   rule. Two title cards, one per page. ---- */
.topband {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 2rem;
  align-items: stretch;
  padding: 0.35rem clamp(1.5rem, 5vw, 4rem) 0.35rem;
  background:
    linear-gradient(color-mix(in srgb, var(--water-top) 35%, transparent),
                    color-mix(in srgb, var(--water-mid) 35%, transparent) 55%,
                    color-mix(in srgb, var(--water-bot) 35%, transparent)),
    var(--card);
  border-bottom: 1px solid var(--frame);
}

/* Each card hangs over the header line, exactly as career.html's cards do
   (B31's overhang grammar, same -14px). */
.topband__card {
  position: relative;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  margin-bottom: -14px;
  padding: 0.25rem 1.1rem;
  border: 2px solid var(--frame);
  border-radius: 3px;
  background: var(--card);
  box-shadow: var(--elevation);
  transition:
    box-shadow 200ms var(--ease),
    filter 200ms var(--ease),
    transform 200ms var(--ease);
}

/* Selection: the radio is checked (default Plants on Poles). The selected
   card wears the career mechanism's glow with --frame itself as the glow
   token (B48, agent-derived — see :root note): border-color + a single soft
   0 0 8px 0 bloom, one token, no other states. */
.topband__card:has(.topband__tab:checked) {
  border-color: var(--frame);
  box-shadow: 0 0 8px 0 var(--frame);
}
.topband__card:active {
  filter: brightness(0.92);
  transform: translateY(2px);
  transition-duration: 80ms;
}
.topband__card:has(.topband__tab:focus-visible) {
  outline: 2px solid var(--ink-light);
  outline-offset: 2px;
}

/* The radio: focusable, never drawn. The label is the card's click surface. */
.topband__tab {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.topband__card-hit {
  position: absolute;
  inset: -2px;
  cursor: pointer;
}

.topband__wordmark {
  margin: 0;
  font-weight: 600;
  font-size: clamp(1.1rem, 2vw, 1.7rem);
  letter-spacing: -0.02em;
  line-height: 1;
}
/* The owner's oneliner copy (B48, verbatim) — these slots are NOT blank. */
.topband__oneliner {
  margin: 0.1rem 0 0;
  max-width: 50rem;
  font-weight: 600;
  font-size: clamp(0.65rem, 0.9vw, 0.8rem);
  color: var(--note);
  line-height: 1.2;
}
/* Unselected: career.html's dim-italic state. */
.topband__card:not(:has(.topband__tab:checked)) .topband__wordmark,
.topband__card:not(:has(.topband__tab:checked)) .topband__oneliner {
  color: var(--ink-dim);
  font-style: italic;
}

main { flex: 1 1 auto; display: flex; }

/* ---- Body — intentionally BLANK (issue #134 §2). Selection swaps between
   two bare empty reader containers driven by :has — one per radio. Each is
   an empty bare container: no styled content, no placeholder images, no
   text, no chevrons, no split furniture (the spec asks for no split here;
   the reader region is just reserved). The containers exist so the future
   PDF pass fills them in place; until then they render nothing. ---- */
.reader { display: none; min-width: 0; }
body:has(#page-poles:checked) .reader--poles,
body:has(#page-rocks:checked) .reader--rocks {
  display: flex;
  flex: 1 1 auto;
}

/* ---- Footer — two sections (issue #134 §3). career.html's .parking-lot,
   same construction with the idea-green water tokens, split TWO ways with
   ONE divider bar of 3/4 of the section's inner length. ---- */
.parking-lot {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 2rem;
  padding: 0.75rem clamp(1.5rem, 5vw, 4rem);
  background:
    linear-gradient(color-mix(in srgb, var(--water-top) 30%, transparent),
                    color-mix(in srgb, var(--water-mid) 30%, transparent) 55%,
                    color-mix(in srgb, var(--water-bot) 45%, transparent)),
    var(--deep);
  border-top: 1px solid color-mix(in srgb, var(--frame) 45%, transparent);
}
/* The divider bar: 1px wide, 3/4 of the section length (the lot's inner
   height), anchored to the band's vertical middle — career.html's
   construction verbatim. */
.parking-lot__divider {
  align-self: stretch;
  display: flex;
  align-items: center;
  width: 1px;
}
.parking-lot__divider::before {
  content: "";
  height: 75%;          /* 3/4 of the section's inner length */
  width: 1px;
  background: color-mix(in srgb, var(--frame) 45%, transparent);
}
.parking-lot__facts {
  flex: 1 1 0;
  font-size: 0.85rem;
  color: rgb(244 245 241 / 0.7);   /* reading text keeps ≥ 4.5:1 */
}

/* The CTA, career.html's .cta grammar re-tokened to the idea-green palette. */
.cta {
  display: flex;
  width: fit-content;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 2px 21px;
  border-radius: 3px;
  background: var(--card);
  color: var(--ink-light);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  box-shadow: var(--elevation), 0 0 6px 0 var(--frame);
  transition:
    box-shadow 200ms var(--ease),
    filter 200ms var(--ease),
    transform 200ms var(--ease);
}
/* The disabled Download button (B48, owner ruling: rendered but disabled —
   it visibly cannot yet work). Dimmed at career.html's shipped 0.55 alpha,
   no pointer cursor, and NO hover/active bloom: the hover/active rules are
   gated on :not([disabled]) so the disabled state stays inert. The 0.55
   alpha is agent-derived (career.html's existing dim value, reused). */
.cta[disabled] {
  opacity: 0.55;
  cursor: not-allowed;
}
@media (hover: hover) {
  .cta:not([disabled]):hover {
    filter: brightness(1.1);
    box-shadow: var(--elevation), 0 0 12px 2px var(--frame), 0 0 24px 4px var(--frame);
  }
}
.cta:not([disabled]):active {
  filter: brightness(0.92);
  transform: translateY(2px);
  box-shadow:
    inset -3px 0 8px rgb(0 0 0 / 0.16),
    inset 0 2px 4px rgb(0 0 0 / 0.1);
  transition-duration: 80ms;
}
.cta:focus-visible {
  outline: 2px solid var(--ink-light);
  outline-offset: 2px;
  box-shadow: var(--elevation), 0 0 12px 2px var(--frame), 0 0 0 4px var(--deep);
}

@media (max-width: 743px) {
  .topband { grid-template-columns: 1fr; row-gap: 0.75rem; padding: 0.8rem 16px 0.9rem; }
  .topband__card { margin-bottom: 0; }
  .topband__oneliner { font-size: 0.8rem; }
  .parking-lot { flex-direction: column; align-items: flex-start; gap: 1rem; }
  .parking-lot__divider { width: auto; align-self: flex-start; }
  .parking-lot__divider::before { width: 75%; height: 1px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>
<h1 class="visually-hidden">Plants &amp; Rocks</h1>

<header class="topband" role="radiogroup" aria-label="Choose a page">
  <!-- Selector card 1 of 2: Plants on Poles (default selection) -->
  <div class="topband__card">
    <input class="topband__tab" type="radio" name="page"
           id="page-poles" checked aria-label="Plants on Poles">
    <h2 class="topband__wordmark">Plants on Poles</h2>
    <p class="topband__oneliner">Monstera Division and Moss Pole Guide</p>
    <label class="topband__card-hit" for="page-poles" aria-label="Select Plants on Poles"></label>
  </div>
  <!-- Selector card 2 of 2: Plants in Rocks -->
  <div class="topband__card">
    <input class="topband__tab" type="radio" name="page"
           id="page-rocks" aria-label="Plants in Rocks">
    <h2 class="topband__wordmark">Plants in Rocks</h2>
    <p class="topband__oneliner">Planting in Semi-Hydroponics With Pon</p>
    <label class="topband__card-hit" for="page-rocks" aria-label="Select Plants in Rocks"></label>
  </div>
</header>

<main>
  <!-- SLOT (blank #1): the Plants on Poles reader (Monstera Division and Moss
       Pole Guide) — the future PDF pass fills this container. B48: the body
       is intentionally blank; this container is a bare empty shell, no
       styled content, no placeholder furniture. -->
  <div class="reader reader--poles">
  </div>

  <!-- SLOT (blank #2): the Plants in Rocks reader (Planting in
       Semi-Hydroponics With Pon) — the future PDF pass fills this container.
       B48: same blank-shell discipline. -->
  <div class="reader reader--rocks">
  </div>
</main>

<footer class="parking-lot">
  <div class="parking-lot__facts">
    <!-- SLOT (blank #3): footer left section — PERMANENTLY EMPTY per B48
         (the spec reserves it; it renders nothing, measures zero). -->
  </div>
  <div class="parking-lot__divider" aria-hidden="true"></div>
  <div class="parking-lot__facts">
    <!-- SLOT (blank #4): the Download target — owner fills in (which PDF the
         button serves, per selected page). Until then the button is rendered
         but DISABLED (B48, owner ruling): aria-disabled, no handler, it
         visibly cannot yet work. -->
    <button class="cta" type="button" disabled aria-disabled="true">Download</button>
  </div>
</footer>

</body>
