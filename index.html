<!DOCTYPE html>
<!-- Portfolio site — index.html, the assembled landing (task t_ec4ab93a).
     Boots the shared engine (frozen) plus the assembly layer (assembly.js /
     assembly.css) in SPA mode: the landing board "The Life of\nRobert
     Gregory" (boards[4]) renders on load, and the sidebar swaps boards with
     the §8 260ms crossfade — no history push (B9 bypassed). The five static
     page files remain as deep links; their rails link to each other. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robert Gregory — Boards</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="engine.css">
  <link rel="stylesheet" href="assembly.css">
</head>
<body>
  <main id="stage">
    <div id="board" data-cat="todo" class="on-dark">
      <section id="band" aria-label="Components and requirements">
        <div class="band-title" id="board-title"></div>
        <div class="band-zone-header" id="zone-components-header">Components</div>
        <div class="band-zone" id="zone-components" role="textbox" aria-multiline="true" aria-label="Components"></div>
        <div class="band-zone-header" id="zone-requirements-header">Requirements</div>
        <div class="band-zone" id="zone-requirements" role="textbox" aria-multiline="true" aria-label="Requirements"></div>
        <div class="band-rule" id="band-rule"></div>
      </section>
      <section id="lot" class="on-dark" aria-label="Parking lot">
        <div id="lot-items"></div>
      </section>
      <svg id="link-layer" aria-hidden="true"></svg>
      <div id="notes"></div>
    </div>
  </main>
  <script src="board-engine.js"></script>
  <script src="assembly.js"></script>
  <script>
    (function () {
      'use strict';
      // The landing board, keyed on its stable id (issue #5, finding 2) —
      // never the title, which carries a literal newline.
      var LANDING_ID = 'fa246b33-d8c8-4ec2-9073-2915de0d5764';

      fetch('assets/content-of-boards.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          window.__boards = data.boards;
          var landing = Assembly.findBoardById(data.boards, LANDING_ID);
          Assembly.bootSpa(data.boards, landing);
        })
        .catch(function (err) {
          document.getElementById('board-title').textContent =
            'Failed to load board: ' + err.message;
          console.error(err);
        });
    })();
  </script>
</body>
</html>
