# Netlify deploy configuration for this repository.
#
# The site root IS the repo root: index.html sits at the top level, and the
# site (razgregory, https://razgregory.netlify.app) publishes from the
# `deploy` branch. A push to `main` publishes nothing; `main` is the working
# branch, and publishing is a `main` -> `deploy` pull request merged on
# purpose. WHICH branch is production is a Netlify UI setting, not a key in
# this file — this file records the build shape, and README.md's Deployment
# section records the branch topology and the branch rule.
#
# Deliberately absent: [build.command] — there is no build step, and any
# command here would either fail the deploy or blank the site. Also absent:
# [build.processing] — the site's processing settings (html.pretty_urls,
# ignore_html_forms) are set in the Netlify UI; a toml override would change
# every URL shape on the site for no requested reason.

[build]
  publish = "."
