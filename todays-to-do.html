<!DOCTYPE html>
<!-- Today's To Do — board page (portfolio page 1 of 4).
     Mounts the shared board engine (engine.css + board-engine.js, issue 0001).
     Nothing here redefines the engine: tokens, note component, scale law,
     connector layer, rail, band, header tab, Parking Lot and hover glow are
     engine-owned. Data: assets/content-of-boards.json → boards[0], title
     "Today's To Do09/27/26", category "todo" → the TODO ladder (--deep #020812
     / card #08152c / frame #698ebf / note #a0d4da) and rail group "To Do" —
     BoardEngine.catOf() performs that mapping; the mount never hardcodes it.
     The export jams the date onto the title with no separator. Per the
     wireframe ../Portfolio-wireframes/page-todays-to-do.png the header tab
     renders it on two lines — "Today's To Do" / "09/27/26", date beneath.
     The source string is NOT repaired or stripped (the board also carries
     cal: "2026-09-27"; both lines are intentional): the mount splits the raw
     title on the trailing MM/DD/YY date and lets .band-title's engine-owned
     white-space: pre-wrap do the break. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robert Gregory — Today's To Do</title>
  <link rel="stylesheet" href="engine.css">
</head>
<body>
  <!-- §13.1 B78 rail: four fixed groups, each wearing its own ladder via [data-cat] -->
  <aside id="rail" aria-label="Board index">
    <div class="rail-group" data-cat="todo">
      <h2 class="rail-head">To Do</h2>
      <div class="rail-cards" data-slot="todo"></div>
    </div>
    <div class="rail-group" data-cat="note">
      <h2 class="rail-head">Notes</h2>
      <div class="rail-cards" data-slot="note"></div>
    </div>
    <div class="rail-group" data-cat="learning">
      <h2 class="rail-head">Learning</h2>
      <div class="rail-cards" data-slot="learning"></div>
    </div>
    <div class="rail-group" data-cat="idea">
      <h2 class="rail-head">Ideas</h2>
      <div class="rail-cards" data-slot="idea"></div>
    </div>
  </aside>
  <main id="stage">
    <!-- Static mount: renderBoard() re-sets data-cat from the board record
         (todo → the TODO ladder), so the page carries no ladder of its own. -->
    <div id="board" data-cat="todo" class="on-dark">
      <section id="band" aria-label="Components and requirements">
        <div class="band-title" id="board-title"></div>
        <div class="band-zone" id="zone-components" role="textbox" aria-multiline="true" aria-label="Components"></div>
        <div class="band-zone" id="zone-requirements" role="textbox" aria-multiline="true" aria-label="Requirements"></div>
        <div class="band-rule" id="band-rule"></div>
        <div class="band-tab on-light" id="band-tab">Components / Requirements</div>
      </section>
      <section id="lot" class="on-dark" aria-label="Parking lot">
        <div id="lot-items"></div>
      </section>
      <svg id="link-layer" aria-hidden="true"></svg>
      <div id="notes"></div>
    </div>
  </main>
  <script src="board-engine.js"></script>
  <script>
    // This page's only job: load the export, render board 0 — "Today's
    // To Do09/27/26" (category "todo" → TODO ladder via catOf) — split its
    // jammed title onto two lines, and fit it. No routing, no build step,
    // no page-local styling (issue 0001 / assembly card owns routing).
    var BOARD_TITLE = "Today's To Do09/27/26";
    // Trailing MM/DD/YY date, jammed on with no separator in the export.
    var DATE_TAIL = /\d{2}\/\d{2}\/\d{2}$/;
    fetch('assets/content-of-boards.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var boards = data.boards;
        window.__boards = boards;
        var board = boards.find(function (b) { return b.title === BOARD_TITLE; });
        if (!board) throw new Error('Board not found in export: ' + BOARD_TITLE);
        var root = document.getElementById('board');
        BoardEngine.renderRail(boards);
        BoardEngine.renderBoard(board, root);
        // Wireframe: title on two lines, date beneath — in the engine's
        // title compartment, using its own pre-wrap; no CSS is touched here.
        var m = board.title.match(DATE_TAIL);
        if (m) {
          document.getElementById('board-title').textContent =
            board.title.slice(0, m.index) + '\n' + m[0];
        }
        BoardEngine.fit(root);
        window.addEventListener('resize', function () { BoardEngine.fit(root); });
      })
      .catch(function (err) {
        // Meaningful failure, not a blank board: surface it where a human looks.
        document.getElementById('board-title').textContent = 'Failed to load board: ' + err.message;
        console.error(err);
      });
  </script>
</body>
</html>
