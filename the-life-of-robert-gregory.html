<!DOCTYPE html>
<!-- The Life of Robert Gregory — landing page (the portfolio's front door).
     Mounts the shared board engine (engine.css + board-engine.js, issue 0001).
     Nothing here redefines the engine: tokens, note component, scale law,
     connector layer, rail, band and Parking Lot are engine-owned.
     Data: assets/content-of-boards.json → boards[4], title "The Life of\nRobert
     Gregory" — the export carries a literal newline and the band renders it as
     two lines (white-space: pre-wrap is engine CSS). Category "todo" → the
     TO DO ladder and the rail's "To Do" group; BoardEngine performs both
     mappings, the mount never hardcodes them.
     The one element this page owns is the contact form (issue §12): the
     parking-lot entry's ASCII box is the wireframe of that form, not copy —
     it is replaced at runtime with a real labelled <textarea> and a
     <button type="submit"> posting to the verified Formspree endpoint. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robert Gregory — The Life of Robert Gregory</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="engine.css">
  <link rel="stylesheet" href="assembly.css">
</head>
<body>
  <!-- §13.1 B78 rail: four fixed groups, each wearing its own ladder via [data-cat] -->
  <aside id="rail" aria-label="Board index">
    <div class="rail-group" data-cat="todo">
      <h2 class="rail-head">To Do</h2>
      <div class="rail-cards" data-slot="todo"></div>
    </div>
    <div class="rail-group" data-cat="note">
      <h2 class="rail-head">Notes</h2>
      <div class="rail-cards" data-slot="note"></div>
    </div>
    <div class="rail-group" data-cat="learning">
      <h2 class="rail-head">Learning</h2>
      <div class="rail-cards" data-slot="learning"></div>
    </div>
    <div class="rail-group" data-cat="idea">
      <h2 class="rail-head">Ideas</h2>
      <div class="rail-cards" data-slot="idea"></div>
    </div>
  </aside>
  <main id="stage">
    <!-- Static mount: data-cat="todo" happens to be this board's own ladder —
         BoardEngine.renderBoard() re-derives it from the data either way. -->
    <div id="board" data-cat="todo" class="on-dark">
      <section id="band" aria-label="Components and requirements">
        <div class="band-title" id="board-title"></div>
        <div class="band-zone" id="zone-components" role="textbox" aria-multiline="true" aria-label="Components"></div>
        <div class="band-zone" id="zone-requirements" role="textbox" aria-multiline="true" aria-label="Requirements"></div>
        <div class="band-rule" id="band-rule"></div>
        <div class="band-tab on-light" id="band-tab">Components / Requirements</div>
      </section>
      <section id="lot" class="on-dark" aria-label="Parking lot">
        <div id="lot-items"></div>
      </section>
      <svg id="link-layer" aria-hidden="true"></svg>
      <div id="notes"></div>
    </div>
  </main>
  <script src="board-engine.js"></script>
  <script src="assembly.js"></script>
  <script>
    (function () {
      'use strict';

      // The export's boards[4]: the title carries a literal newline — matched
      // exactly as stored, never normalised.
      var BOARD_TITLE = 'The Life of\nRobert Gregory';

      fetch('assets/content-of-boards.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var boards = data.boards;
          window.__boards = boards;
          var board = boards.find(function (b) { return b.title === BOARD_TITLE; });
          if (!board) throw new Error('Board not found in export: ' + JSON.stringify(BOARD_TITLE));
          var root = document.getElementById('board');
          BoardEngine.renderRail(boards);
          BoardEngine.renderBoard(board, root);
          BoardEngine.fit(root);
          window.addEventListener('resize', function () { BoardEngine.fit(root); });
          Assembly.mountContactForm(root);
          // Assembly: rail cards navigate between the five pages; this page is marked active.
          Assembly.wireStaticPage(board);
        })
        .catch(function (err) {
          // Meaningful failure, not a blank board: surface it where a human looks.
          document.getElementById('board-title').textContent = 'Failed to load board: ' + err.message;
          console.error(err);
        });

    })();
  </script>
</body>
</html>
