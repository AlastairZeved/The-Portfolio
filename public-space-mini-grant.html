<!DOCTYPE html>
<!-- Public Space Mini Grant — board page (portfolio page 4 of 4).
     Mounts the shared board engine (engine.css + board-engine.js, issue 0001).
     Nothing here redefines the engine: tokens, note component, scale law,
     connector layer, rail, band, Parking Lot and hover glow are engine-owned.
     Data: assets/content-of-boards.json → boards[3], title "Public Space Mini
     Grant", category "unsorted". Per §2.2.2 the `unsorted` bucket reads as a
     NOTE board — data-cat="note" ladder (deep #0c0512 / card #1e0f28 / frame
     #9d80b9 / note #cec6ed) — and per §13.1 B78 the rail group label is
     "Notes". BoardEngine.catOf() performs that mapping; the mount below never
     hardcodes it. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robert Gregory — Public Space Mini Grant</title>
  <link rel="stylesheet" href="engine.css">
  <link rel="stylesheet" href="assembly.css">
</head>
<body>
  <main id="stage">
    <!-- Static mount: data-cat is set per-board by BoardEngine.renderBoard()
         (catOf: unsorted → note), so this page carries no ladder of its own. -->
    <div id="board" data-cat="note" class="on-dark">
      <section id="band" aria-label="Components and requirements">
        <div class="band-title" id="board-title"></div>
        <div class="band-zone-header" id="zone-components-header">Components</div>
        <div class="band-zone" id="zone-components" role="textbox" aria-multiline="true" aria-label="Components"></div>
        <div class="band-zone-header" id="zone-requirements-header">Requirements</div>
        <div class="band-zone" id="zone-requirements" role="textbox" aria-multiline="true" aria-label="Requirements"></div>
        <div class="band-rule" id="band-rule"></div>
      </section>
      <section id="lot" class="on-dark" aria-label="Parking lot">
        <div id="lot-items"></div>
      </section>
      <svg id="link-layer" aria-hidden="true"></svg>
      <div id="notes"></div>
    </div>
  </main>
  <script src="board-engine.js"></script>
  <script src="assembly.js"></script>
  <script>
    // This page's only job: boot boards[3] — Public Space Mini Grant (category
    // "unsorted" → NOTE ladder via catOf). No routing, no build step, no
    // page-local styling (issue 0001 / assembly).
    Assembly.boot('ba0c4910-e43e-40fc-886a-d3730c42c897');
  </script>
</body>
</html>
