<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monstera Division and Moss Pole Introduction</title>
<style>
/* Monstera Division & Moss Pole Introduction — storybook component.
   Palette: TheBoards' Idea-green ladder (TheBoards styles.css, UIUX §2.2.2). */
:root {
  --deep: #000a06;
  --card: #001a0e;
  --water-top: #486b49;
  --water-mid: #345439;
  --water-bot: #1f3825;
  --frame: #52997f;
  --note: #b9d2b2;
  --ink-light: #f4f5f1;
  --ink: var(--ink-light);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, sans-serif;
  background: var(--deep);
  color: var(--ink);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.band {
  flex: none; height: 56px; position: relative;
  background: linear-gradient(180deg, var(--water-top) 0%, var(--water-mid) 46%, var(--water-bot) 100%);
  display: flex; align-items: center; justify-content: center; gap: 28px;
}
#band-bottom { border-top: 1px solid var(--frame); background: linear-gradient(0deg, var(--water-top) 0%, var(--water-mid) 46%, var(--water-bot) 100%); }
.band button {
  width: 44px; height: 44px; border-radius: 3px;
  border: 2px solid var(--note); background: var(--card); color: var(--note);
  font-size: 20px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.band button:disabled { opacity: 0.4; cursor: default; }
.band button:not(:disabled):hover { background: var(--note); color: var(--deep); }
#stage-wrap { flex: 1; min-height: 0; width: 100%; display: flex; }
#stage { position: relative; width: 100%; height: 100%; perspective: 1600px; }
.spread { position: absolute; inset: 0; display: flex; z-index: 1; }
.spread.top { z-index: 2; }
.half {
  width: 50%; height: 100%; min-width: 0;
  display: flex; align-items: center; justify-content: center;
}
.half + .half { border-left: 1px solid var(--frame); }
.half img {
  display: block; max-width: 100%; max-height: 100%;
  width: auto; height: auto; object-fit: contain;
  background: var(--card);
  box-shadow: 0 6px 24px rgb(0 0 0 / 0.55);
}
/* the turning sheet: overlays one half, rotates around the spine */
.turn {
  position: absolute; z-index: 5;
  transform-style: preserve-3d;
  box-shadow: 0 6px 24px rgb(0 0 0 / 0.55);
  background: var(--card);
}
.turn .face { position: absolute; inset: 0; backface-visibility: hidden; }
.turn .face img { width: 100%; height: 100%; object-fit: fill; display: block; background: var(--card); }
.turn .face.back { transform: rotateY(180deg); }
.turn.next { transform-origin: left center; animation: turn-next 850ms cubic-bezier(.5,.06,.36,1) both; }
.turn.prev { transform-origin: right center; animation: turn-prev 850ms cubic-bezier(.5,.06,.36,1) both; }
@keyframes turn-next {
  0%   { transform: rotateY(0) translateZ(0); }
  50%  { transform: rotateY(-90deg) translateZ(28px); }
  100% { transform: rotateY(-180deg) translateZ(0); }
}
@keyframes turn-prev {
  0%   { transform: rotateY(0) translateZ(0); }
  50%  { transform: rotateY(90deg) translateZ(28px); }
  100% { transform: rotateY(180deg) translateZ(0); }
}
/* the grabbed corner folds up, then the sheet takes over */
.curl { position: absolute; top: 0; width: 16%; aspect-ratio: 1 / 1; opacity: 0; pointer-events: none; animation: curl 850ms ease-out both; }
.turn.next .curl { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); background: linear-gradient(225deg, #f2f4ef 0%, #c9d4c4 65%, #a8b8a6 100%); }
.turn.prev .curl { left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); background: linear-gradient(135deg, #f2f4ef 0%, #c9d4c4 65%, #a8b8a6 100%); }
@keyframes curl {
  0%   { opacity: 0; transform: scale(0.4); }
  22%  { opacity: 0.95; transform: scale(1); }
  40%  { opacity: 0; transform: scale(1.12); }
  100% { opacity: 0; }
}
@media (max-width: 767px) {
  .half { width: 100%; }
  .half img { max-width: calc(100% - 24px); }
}
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage"></div></div>
<div class="band" id="band-bottom">
  <button id="prev" aria-label="Previous page">&#8249;</button>
  <button id="next" aria-label="Next page">&#8250;</button>
</div>
<script src="monstera-storybook.js"></script>
</body>
</html>
